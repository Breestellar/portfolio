<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Message sent | Brendah Stella</title>
    <style>
      :root {
        --paper: #ffffff;
        --paper-warm: #fdf8f3;
        --ink: #1b1712;
        --ink-soft: #4a443e;
        --muted: #847c72;
        --line: #e9dfd2;
        --accent: #e43d12;
        --accent-deep: #b92f0c;
        --serif: "Georgia", "Times New Roman", serif;
        --sans: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: var(--paper-warm);
        color: var(--ink);
        font-family: var(--sans);
      }

      main {
        width: min(620px, 100%);
        padding: 56px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        text-align: center;
      }

      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 1.25rem;
        font-weight: 700;
      }

      p.label {
        margin: 0 0 12px;
        color: var(--accent-deep);
        font-family: monospace;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-family: var(--serif);
        font-size: clamp(2.2rem, 6vw, 3.6rem);
        line-height: 1.05;
        font-weight: 600;
      }

      .message {
        max-width: 480px;
        margin: 0 auto 30px;
        color: var(--ink-soft);
        font-size: 1rem;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 9px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        background: var(--accent-deep);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      @media (max-width: 600px) {
        body {
          padding: 20px;
        }
        main {
          padding: 40px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <p class="label">Message sent</p>
      <h1>Thanks for reaching out.</h1>
      <p class="message">
        Your message has been sent successfully. I'll get back to you as soon as
        I can.
      </p>
      <a href="./">Back to portfolio</a>
    </main>
  </body>
</html>
